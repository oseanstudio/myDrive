[package]
name = "mydrive-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
quick-xml = { version = "0.37", features = ["serialize"] }
ssh2 = "0.9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.4"
chrono = "0.4"
url = "2"
tempfile = "3"
percent-encoding = "2"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WNet", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
