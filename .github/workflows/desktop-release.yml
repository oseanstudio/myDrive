name: Publish desktop release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Mac/**'
      - 'Linux/**'
      - 'Core/**'
      - 'Blip/**'
      - 'docs/BLIP.md'
      - 'tests/source-safety.mjs'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/macos-dmg.yml'
      - '.github/workflows/linux-appimage.yml'

permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mac:
    uses: ./.github/workflows/macos-dmg.yml
  linux:
    uses: ./.github/workflows/linux-appimage.yml
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source safety
        run: node tests/source-safety.mjs .
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: Core/SmbHost/go.mod
          cache-dependency-path: Core/SmbHost/go.sum
      - name: Build and test native Windows app
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'mydrive-rust'
          cargo test --locked --manifest-path Core/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path Core/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $payload = Join-Path $env:RUNNER_TEMP 'mydrive-publish'
          dotnet publish Windows/App/myDrive.csproj -c Release -p:Platform=x64 -o $payload --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/mydrive-core.exe') -Destination $payload
          & ./Windows/packaging/collect-notices.ps1 -AssetsFile Windows/App/obj/project.assets.json -PublishDirectory $payload
          node Core/third-party-notices.mjs Core/Cargo.toml (Join-Path $payload 'ThirdPartyNotices.txt')
          exit $LASTEXITCODE
      - name: Build and test private SMB hosting
        working-directory: Core/SmbHost
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          go run build.go --test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go run build.go (Join-Path $env:RUNNER_TEMP 'mydrive-publish')
          exit $LASTEXITCODE
      - name: Package and exercise the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Windows/App/myDrive.csproj -Raw)).Project.PropertyGroup.Version
          $payload = Join-Path $env:RUNNER_TEMP 'mydrive-publish'
          $output = Join-Path $env:RUNNER_TEMP 'mydrive-windows'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          New-Item -ItemType Directory -Path $output | Out-Null
          & $compiler "/DPayloadDir=$payload" "/DAppVersion=$version" "/O$output" Windows/packaging/myDrive.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $asset = 'myDrive-Windows-x64-Setup.exe'
          $installer = Join-Path $output $asset
          $directory = Join-Path $env:RUNNER_TEMP 'mydrive-installer-check'
          $setup = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$directory`"" -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode) { throw "Installer failed with exit code $($setup.ExitCode)." }
          foreach ($notice in @('ThirdPartyNotices.txt', 'Windows-ThirdPartyNotices.txt', 'SMB-ThirdPartyNotices.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $directory $notice) -PathType Leaf)) { throw "Missing installer notice $notice." }
          }
          $app = Get-Item -LiteralPath (Join-Path $directory 'myDrive.exe')
          if ($app.VersionInfo.ProductVersion -notlike "$version*") { throw 'Installed version differs from the build.' }
          $core = Join-Path $directory 'mydrive-core.exe'
          $result = '{"action":"version"}' | & $core | ConvertFrom-Json
          if (!$result.ok) { throw 'The installed core did not respond.' }
          $shareHost = Join-Path $directory 'mydrive-smb-host.exe'
          $hostResult = '{"action":"list"}' | & $shareHost | ConvertFrom-Json
          if (!$hostResult -or $hostResult.error) { throw 'The installed SMB host did not respond.' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $output "$asset.sha256"), "$hash  $asset`n")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myDrive-Windows-x64
          path: |
            ${{ runner.temp }}/mydrive-windows/myDrive-Windows-x64-Setup.exe
            ${{ runner.temp }}/mydrive-windows/myDrive-Windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [mac, linux, windows]
    if: github.repository_id == '1465782893' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: myDrive-*-*
          merge-multiple: true
          path: ${{ runner.temp }}/mydrive-release-assets
      - name: Verify and publish all desktop assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GH_REPO" --json isPrivate -q .isPrivate)" = false
          version="$(python3 -c 'import xml.etree.ElementTree as xml; print(xml.parse("Windows/App/myDrive.csproj").findtext("PropertyGroup/Version"))')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-preview-${GITHUB_SHA:0:8}"
          asset_dir="$RUNNER_TEMP/mydrive-release-assets"
          cd "$asset_dir"
          packages=(myDrive-Windows-x64-Setup.exe myDrive-Linux-x86_64.AppImage myDrive-macOS-AppleSilicon.dmg)
          assets=()
          for package in "${packages[@]}"; do
            test -s "$package"
            sha256sum --check "$package.sha256"
            assets+=("$package" "$package.sha256")
          done
          if existing="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ $existing == false ]]; then
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            printf 'Desktop preview built from commit %s.\n\nIncludes the Windows x64 installer, Linux x86-64 AppImage, and Apple Silicon macOS DMG.\n\nThe installer is unsigned. The DMG is ad-hoc signed.\n' "$GITHUB_SHA" > "$RUNNER_TEMP/mydrive-release-notes.md"
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "myDrive $version Preview (${GITHUB_SHA:0:8})" --notes-file "$RUNNER_TEMP/mydrive-release-notes.md" --draft --prerelease
          fi
          for asset in "${assets[@]}"; do
            gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx "$asset" > /dev/null
          done
          gh release edit "$tag" --draft=false
