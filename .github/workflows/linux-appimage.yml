name: Build Linux AppImage
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
permissions:
  contents: read
concurrency:
  group: linux-appimage-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      MYDRIVE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source safety
        run: node tests/source-safety.mjs .
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: Core/SmbHost/go.mod
          cache-dependency-path: Core/SmbHost/go.sum
      - name: Configure Linux build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential desktop-file-utils gir1.2-gtk-4.0 libssl-dev python3-gi squashfs-tools xvfb xauth
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/mydrive-rust" >> "$GITHUB_ENV"
          echo "MYDRIVE_BUILD_DIR=$RUNNER_TEMP/mydrive-linux" >> "$GITHUB_ENV"
      - name: Build and exercise the AppImage
        run: bash Linux/build-appimage.sh
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myDrive-Linux-x86_64
          path: |
            ${{ env.MYDRIVE_BUILD_DIR }}/myDrive-Linux-x86_64.AppImage
            ${{ env.MYDRIVE_BUILD_DIR }}/myDrive-Linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
