name: myDrive
options:
  bundleIdPrefix: net.oseanstudio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.4.0"
packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    exactVersion: 4.0.3
targets:
  myDrive:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oseanstudio.mydrive
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: AMSMB2
  myDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: myDrive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  myDrive:
    build:
      targets:
        myDrive: all
    test:
      targets: [myDriveTests]
